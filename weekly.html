<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitTrack — This week</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>FitTrack</h1>
    <button id="logout-btn" class="icon-btn">Log out</button>
  </header>
  <nav class="tabs">
    <a href="index.html">Today</a>
    <a href="weekly.html">This week</a>
    <a href="food.html">Log food</a>
    <a href="progress.html">Progress</a>
    <a href="summary.html">Recaps</a>
  </nav>

  <div class="container">
    <div class="card">
      <h2>This week's goals</h2>
      <p class="muted" id="week-range"></p>
      <ul class="list" id="weekly-task-list"></ul>
      <form class="inline-add" id="weekly-task-form">
        <input type="text" id="weekly-task-input" placeholder="Add a goal for this week" />
        <button type="submit" class="btn">Add</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/weekly.js"></script>
</body>
</html>
